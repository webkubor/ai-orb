# README 里的「▶ Live demo」链接指向这里。
# demo 直接 import src/ 源码，所以站点就是仓库本身——不需要构建，
# 但 src/ 必须一起发上去，否则页面加载了却一颗球都没有。
name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点（demo 提到根，src 原样带上）
        run: |
          mkdir -p _site
          cp demo/index.html _site/index.html
          cp demo/interaction.css _site/interaction.css
          cp demo/embed* _site/
          sed -i "s|'../src/widget.js'|'./src/widget.js'|" _site/embed.js
          cp demo/showcase.html _site/showcase.html
          cp demo/promo.html _site/promo.html
          cp -r demo/media _site/media
          cp -r src _site/src
          # demo 里写的是 ../src/xxx.js，提到根之后要改成 ./src/（index 与 creatures 两个入口都要改）
          for f in _site/index.html _site/promo.html; do
            sed -i "s|'../src/|'./src/|g" "$f"
            if grep -q "'../src/" "$f"; then echo "::error::$f 里还有 ../src/ 路径，线上会 404"; exit 1; fi
          done
          grep -q "'./src/creatures.js'" _site/index.html || { echo "::error::展示页没加载生灵插件，3.0 展区会是空的"; exit 1; }
          test -f _site/media/ai-orb-3.mp4 || { echo "::error::推广视频没带上"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
