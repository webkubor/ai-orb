name: Publish

# 用 npm Trusted Publisher（OIDC）：不存任何 NPM_TOKEN，GitHub Actions 直接向
# npm 证明「这次发布来自这个仓库的这个 workflow」，短时凭据，自动带 provenance。
#
# 发布前 npm 网页上必须已配置 Trusted Publisher：
#   Publisher = GitHub Actions
#   Organization/user = webkubor
#   Repository       = ai-orb
#   Workflow filename = publish.yml          ← 必须与本文件名一致
#   Environment      = （留空）
#
# 触发：推 v* tag，或手动 workflow_dispatch（发 package.json 当前版本）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publisher 必需：允许向 npm 换取 OIDC 凭据

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publisher 要求 npm >= 11.5.1
      - name: 升级 npm 确保支持 OIDC
        run: npm install -g npm@latest

      - name: 确认 npm 版本支持 OIDC
        run: |
          npm -v
          node -e "
            const v = require('child_process').execSync('npm -v').toString().trim().split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) {
              console.error('✘ npm ' + v.join('.') + ' 太旧，Trusted Publisher 需要 >= 11.5.1');
              process.exit(1);
            }
          "

      - run: npm ci
      - run: npm test

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致"; exit 1; }

      - name: 校验 CHANGELOG 顶部版本与发版一致
        run: |
          TOP=$(awk '/^## \[/{gsub(/[\[\]]/,"",$2); print $2; exit}' CHANGELOG.md)
          PKG=$(node -p "require('./package.json').version")
          [ "$TOP" = "$PKG" ] || { echo "::error::CHANGELOG 顶部是 $TOP，要发的是 $PKG，先写更新说明"; exit 1; }

      - name: 校验版本未被发布过
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION 已存在于 npm，先升 package.json 的 version"; exit 1
          fi

      # setup-node 会写一行 `_authToken=${NODE_AUTH_TOKEN}`；没有 token 时展开成空凭据，
      # 会让 OIDC 路径走不通，所以删掉它
      - name: 移除空认证行
        run: |
          sed -i -E '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG" 2>/dev/null || true
          [ -f "$HOME/.npmrc" ] && sed -i -E '/:_authToken=/d' "$HOME/.npmrc" || true
          [ -f .npmrc ] && sed -i -E '/:_authToken=/d' .npmrc || true

      - name: 发布到 npm
        run: npm publish --access public --provenance

      - name: 回读确认
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5 6; do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✓ $NAME@$VERSION 已在 npm 上可查"; exit 0
            fi
            echo "… 第 $i 次未查到，30s 后重试"; sleep 30
          done
          echo "::error::发布后 3 分钟内仍查不到该版本"; exit 1
